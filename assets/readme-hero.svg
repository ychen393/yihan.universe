<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Yihan's Universe</title>
  <desc id="desc">A cinematic galaxy-style banner for Yihan's interdisciplinary portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1724"/>
      <stop offset=".48" stop-color="#132b3e"/>
      <stop offset="1" stop-color="#0d1c2a"/>
    </linearGradient>
    <radialGradient id="mistA" cx=".22" cy=".35" r=".62">
      <stop offset="0" stop-color="#49789d" stop-opacity=".34"/>
      <stop offset=".52" stop-color="#31566f" stop-opacity=".10"/>
      <stop offset="1" stop-color="#31566f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistB" cx=".82" cy=".44" r=".54">
      <stop offset="0" stop-color="#d7a676" stop-opacity=".18"/>
      <stop offset=".52" stop-color="#a16e4c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#a16e4c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx=".3" cy=".24" r=".82">
      <stop offset="0" stop-color="#f4e4d2"/>
      <stop offset=".18" stop-color="#caa27d"/>
      <stop offset=".58" stop-color="#596f80"/>
      <stop offset="1" stop-color="#203243"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" x2="1">
      <stop offset="0" stop-color="#d9c2a8" stop-opacity="0"/>
      <stop offset=".48" stop-color="#f2dbc1" stop-opacity=".78"/>
      <stop offset="1" stop-color="#9fc6d7" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1400" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="34" fill="url(#mistA)"/>
  <rect width="1400" height="520" rx="34" fill="url(#mistB)"/>

  <g fill="#edf6fa">
    <circle cx="74" cy="71" r="1.5" opacity=".42"/><circle cx="148" cy="122" r="2" opacity=".26"/>
    <circle cx="231" cy="63" r="1.2" opacity=".52"/><circle cx="356" cy="104" r="1.7" opacity=".30"/>
    <circle cx="502" cy="53" r="1.3" opacity=".42"/><circle cx="613" cy="132" r="1.8" opacity=".24"/>
    <circle cx="744" cy="76" r="1.3" opacity=".42"/><circle cx="865" cy="118" r="2.1" opacity=".33"/>
    <circle cx="986" cy="61" r="1.2" opacity=".45"/><circle cx="1110" cy="99" r="1.8" opacity=".32"/>
    <circle cx="1276" cy="58" r="1.6" opacity=".4"/><circle cx="1334" cy="147" r="1.3" opacity=".42"/>
    <circle cx="88" cy="402" r="1.4" opacity=".36"/><circle cx="203" cy="452" r="1.8" opacity=".26"/>
    <circle cx="438" cy="428" r="1.2" opacity=".36"/><circle cx="571" cy="472" r="1.6" opacity=".3"/>
    <circle cx="813" cy="444" r="1.5" opacity=".42"/><circle cx="1017" cy="468" r="1.3" opacity=".34"/>
    <circle cx="1219" cy="420" r="1.9" opacity=".32"/><circle cx="1341" cy="466" r="1.2" opacity=".4"/>
  </g>

  <path d="M-80 402 C210 235 472 248 682 341 S1040 418 1478 252" fill="none" stroke="#7eabc4" stroke-opacity=".07" stroke-width="130"/>
  <path d="M-40 398 C214 257 466 265 686 343 S1055 404 1455 265" fill="none" stroke="#bad2dd" stroke-opacity=".13" stroke-width="1.5"/>
  <path d="M-10 426 C228 298 475 302 691 367 S1068 424 1434 298" fill="none" stroke="#dcc0a1" stroke-opacity=".10" stroke-width="1"/>

  <g transform="translate(850 56)">
    <ellipse cx="290" cy="210" rx="245" ry="78" fill="none" stroke="url(#orbit)" stroke-width="2.4" transform="rotate(-13 290 210)"/>
    <ellipse cx="290" cy="210" rx="198" ry="128" fill="none" stroke="#c5d9e2" stroke-opacity=".12" stroke-width="1.2" transform="rotate(23 290 210)"/>
    <ellipse cx="290" cy="210" rx="145" ry="176" fill="none" stroke="#e2c6a8" stroke-opacity=".10" stroke-width="1.1" transform="rotate(62 290 210)"/>
    <circle cx="290" cy="210" r="82" fill="#dcb286" opacity=".16" filter="url(#blur)"/>
    <circle cx="290" cy="210" r="68" fill="url(#planet)" stroke="#f3dac0" stroke-opacity=".52" stroke-width="1.4"/>
    <path d="M255 153 C274 140 295 137 316 140" fill="none" stroke="#fff5e9" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" letter-spacing="2">
      <g transform="translate(31 136)">
        <circle cx="0" cy="0" r="5" fill="#93cceb"/>
        <circle cx="0" cy="0" r="17" fill="#93cceb" opacity=".08" filter="url(#glow)"/>
        <text x="18" y="4" fill="#d9e8ef">JOURNEY</text>
      </g>
      <g transform="translate(512 136)">
        <circle cx="0" cy="0" r="5" fill="#e1b284"/>
        <circle cx="0" cy="0" r="17" fill="#e1b284" opacity=".08" filter="url(#glow)"/>
        <text x="-74" y="4" fill="#ead8c6">WORK</text>
      </g>
      <g transform="translate(432 357)">
        <circle cx="0" cy="0" r="5" fill="#b896d3"/>
        <circle cx="0" cy="0" r="17" fill="#b896d3" opacity=".08" filter="url(#glow)"/>
        <text x="-98" y="4" fill="#e0d0ea">CURIOSITY</text>
      </g>
    </g>
  </g>

  <g transform="translate(88 100)">
    <text x="0" y="0" fill="#e9c4a1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750" letter-spacing="3.6">INTERDISCIPLINARY PROBLEM SOLVER</text>
    <text x="0" y="78" fill="#f4efe9" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="400" letter-spacing="-3">Yihan’s Universe</text>
    <text x="0" y="127" fill="#cad5dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450">Statistics × AI Systems × Product × Business</text>
    <line x1="0" y1="166" x2="128" y2="166" stroke="#e1b68f" stroke-width="2"/>
    <text x="0" y="216" fill="#f0dfcf" font-family="Georgia,'Times New Roman',serif" font-size="34" font-style="italic">“What if?”</text>
    <text x="0" y="254" fill="#aebdc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">A portfolio designed as a navigable universe — not a résumé wall.</text>
  </g>

  <g transform="translate(90 430)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#f0cba8"/>
    <text x="80" y="23" text-anchor="middle" fill="#1b2b38" font-size="12" font-weight="750" letter-spacing=".5">13 CASE STUDIES</text>
    <rect x="172" y="0" width="112" height="36" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#d9e4e9" stroke-opacity=".18"/>
    <text x="228" y="23" text-anchor="middle" fill="#dce6eb" font-size="12" font-weight="650">中 / EN</text>
    <rect x="296" y="0" width="154" height="36" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#d9e4e9" stroke-opacity=".18"/>
    <text x="373" y="23" text-anchor="middle" fill="#dce6eb" font-size="12" font-weight="650">VERCEL · LIVE</text>
  </g>
</svg>